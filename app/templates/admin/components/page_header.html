<div class="page-header mb-4">

    <div>
        <h1 class="page-title mb-1">
            {{ title }}
        </h1>

        {% if subtitle %}
            <p class="page-subtitle text-muted mb-0">
                {{ subtitle }}
            </p>
        {% endif %}
    </div>

    {% if action_url and action_text %}
        <div>
            <a href="{{ action_url }}" class="btn btn-primary">
                {{ action_text }}
            </a>
        </div>
    {% endif %}

</div>
