<div class="col-md-6 col-xl-3">

    <div class="card stat-card h-100">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-start">

                <div>

                    <h6 class="text-muted mb-2">
                        {{ title }}
                    </h6>

                    <h2 class="mb-0 fw-bold">
                        {{ value }}
                    </h2>

                </div>

                {% if icon %}
                    <div class="stat-icon">
                        <i class="{{ icon }}"></i>
                    </div>
                {% endif %}

            </div>

        </div>

    </div>

</div>
