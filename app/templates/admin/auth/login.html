<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
</head>

<body>

<h2>BEST CONTROL CMS</h2>

<form method="POST">

    {{ form.hidden_tag() }}

    <p>
        {{ form.username.label }}<br>
        {{ form.username(size=40) }}
    </p>

    <p>
        {{ form.password.label }}<br>
        {{ form.password(size=40) }}
    </p>

    <p>
        {{ form.remember() }}
        {{ form.remember.label }}
    </p>

    <p>
        {{ form.submit() }}
    </p>

</form>

</body>
</html>
