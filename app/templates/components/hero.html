<section class="hero" id="hero-section">
  <div class="container hero-container" id="hero-container">
    <!-- ==========================
             LEFT CONTENT
        =========================== -->

    <div class="hero-content" id="hero-content">
      <div class="hero-badge" id="hero-badge"></div>

      <h1 id="hero-title"></h1>

      <p id="hero-description"></p>

      <div class="hero-buttons">
        <a id="hero-primary-btn" class="btn btn-primary" href="#"> </a>

        <a id="hero-secondary-btn" class="btn btn-outline" href="#"> </a>
      </div>

      <div class="hero-features" id="hero-features"></div>
    </div>

    <!-- ==========================
             RIGHT PRODUCT SHOWCASE
        =========================== -->

    <div class="hero-image" id="hero-product-area">
      <button class="hero-nav hero-prev" id="hero-prev">&#10094;</button>

      <div class="hero-showcase">
        <div class="showcase-stage">
          <div class="hero-image-wrapper" id="hero-image-wrapper">
            <div class="hero-circle"></div>

            <img id="hero-product-image" alt="Industrial Transformer" />
          </div>

          <div class="product-spec-card" id="product-card">
            <span class="product-model" id="product-model"> </span>

            <h3 class="product-title" id="product-title"></h3>

            <div class="spec-grid" id="product-spec-grid"></div>
          </div>
        </div>
      </div>

      <button class="hero-nav hero-next" id="hero-next">&#10095;</button>
    </div>
  </div>
</section>
